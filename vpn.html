<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Turky VPN</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #020617, #0f172a);
            color: white;
            min-height: 100vh;
        }

        .container {
            width: 92%;
            max-width: 500px;
            margin: 35px auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
        }

        .language {
            padding: 9px 12px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #1e293b;
            color: white;
        }

        .card {
            background: rgba(30, 41, 59, .95);
            border: 1px solid #334155;
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
        }

        .server-box {
            background: #0f172a;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 25px;
        }

        .server-label {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .server-select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: #1e293b;
            color: white;
            font-size: 16px;
        }

        .status {
            text-align: center;
            margin: 20px 0;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background: #ef4444;
            border-radius: 50%;
            display: inline-block;
            margin-left: 7px;
        }

        .status-dot.online {
            background: #22c55e;
            box-shadow: 0 0 15px #22c55e;
        }

        .connect-button {
            display: block;
            width: 170px;
            height: 170px;
            margin: 25px auto;
            border-radius: 50%;
            border: 8px solid #334155;
            background: #22c55e;
            color: white;
            font-size: 23px;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
        }

        .connect-button:hover {
            transform: scale(1.05);
        }

        .connect-button.connected {
            background: #ef4444;
        }

        .timer {
            text-align: center;
            font-size: 25px;
            margin: 15px;
            font-family: monospace;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 25px;
        }

        .stat {
            background: #0f172a;
            padding: 18px;
            border-radius: 15px;
        }

        .stat-title {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: bold;
        }

        .ip {
            margin-top: 12px;
            background: #0f172a;
            padding: 17px;
            border-radius: 15px;
            text-align: center;
        }

        .footer {
            text-align: center;
            color: #64748b;
            margin-top: 20px;
            font-size: 13px;
        }

        @media(max-width: 400px) {
            .connect-button {
                width: 145px;
                height: 145px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">🛡️ TURKY VPN</div>

        <select class="language" id="language" onchange="changeLanguage()">
            <option value="ar">العربية</option>
            <option value="en">English</option>
        </select>
    </div>

    <div class="card">

        <div class="server-box">

            <div class="server-label" id="serverLabel">
                اختيار السيرفر
            </div>

            <select class="server-select" id="server">
                <option>🇪🇬 Egypt</option>
                <option>🇩🇪 Germany</option>
                <option>🇺🇸 United States</option>
                <option>🇬🇧 United Kingdom</option>
                <option>🇳🇱 Netherlands</option>
            </select>

        </div>

        <div class="status">

            <span class="status-dot" id="dot"></span>

            <strong id="status">
                غير متصل
            </strong>

        </div>

        <button
            class="connect-button"
            id="connectButton"
            onclick="toggleVPN()"
        >
            اتصال
        </button>

        <div class="timer" id="timer">
            00:00:00
        </div>

        <div class="stats">

            <div class="stat">
                <div class="stat-title" id="downloadTitle">
                    التحميل
                </div>

                <div class="stat-value" id="download">
                    0 KB/s
                </div>
            </div>

            <div class="stat">
                <div class="stat-title" id="uploadTitle">
                    الرفع
                </div>

                <div class="stat-value" id="upload">
                    0 KB/s
                </div>
            </div>

        </div>

        <div class="ip">

            <div class="stat-title" id="ipTitle">
                عنوان IP
            </div>

            <div class="stat-value" id="ip">
                --
            </div>

        </div>

    </div>

    <div class="footer" id="footer">
        Nova VPN • اتصال آمن وسريع
    </div>

</div>


<script>

let connected = false;
let seconds = 0;
let timerInterval = null;
let statsInterval = null;


function toggleVPN() {

    connected = !connected;

    const button = document.getElementById("connectButton");
    const status = document.getElementById("status");
    const dot = document.getElementById("dot");

    if (connected) {

        button.classList.add("connected");
        dot.classList.add("online");

        seconds = 0;

        timerInterval = setInterval(updateTimer, 1000);
        statsInterval = setInterval(updateStats, 1000);

        updateLanguageText();

    } else {

        button.classList.remove("connected");
        dot.classList.remove("online");

        clearInterval(timerInterval);
        clearInterval(statsInterval);

        updateLanguageText();

        document.getElementById("timer").textContent = "00:00:00";
        document.getElementById("download").textContent = "0 KB/s";
        document.getElementById("upload").textContent = "0 KB/s";
        document.getElementById("ip").textContent = "--";
    }
}


function updateTimer() {

    seconds++;

    let h = Math.floor(seconds / 3600);
    let m = Math.floor((seconds % 3600) / 60);
    let s = seconds % 60;

    h = String(h).padStart(2, "0");
    m = String(m).padStart(2, "0");
    s = String(s).padStart(2, "0");

    document.getElementById("timer").textContent =
        `${h}:${m}:${s}`;
}


function updateStats() {

    const download =
        Math.floor(Math.random() * 900) + 100;

    const upload =
        Math.floor(Math.random() * 300) + 50;

    document.getElementById("download").textContent =
        download + " KB/s";

    document.getElementById("upload").textContent =
        upload + " KB/s";

    document.getElementById("ip").textContent =
        "10.8.0." + Math.floor(Math.random() * 200 + 2);
}


function changeLanguage() {

    updateLanguageText();

    const lang =
        document.getElementById("language").value;

    document.documentElement.lang = lang;

    document.documentElement.dir =
        lang === "ar" ? "rtl" : "ltr";
}


function updateLanguageText() {

    const lang =
        document.getElementById("language").value;

    const status =
        document.getElementById("status");

    const button =
        document.getElementById("connectButton");

    if (lang === "en") {

        document.getElementById("serverLabel").textContent =
            "Select Server";

        document.getElementById("downloadTitle").textContent =
            "Download";

        document.getElementById("uploadTitle").textContent =
            "Upload";

        document.getElementById("ipTitle").textContent =
            "IP Address";

        document.getElementById("footer").textContent =
            "Nova VPN • Fast & Secure Connection";

        if (connected) {

            status.textContent = "Connected";
            button.textContent = "Disconnect";

        } else {

            status.textContent = "Disconnected";
            button.textContent = "Connect";
        }

    } else {

        document.getElementById("serverLabel").textContent =
            "اختيار السيرفر";

        document.getElementById("downloadTitle").textContent =
            "التحميل";

        document.getElementById("uploadTitle").textContent =
            "الرفع";

        document.getElementById("ipTitle").textContent =
            "عنوان IP";

        document.getElementById("footer").textContent =
            "TURKY VPN • اتصال آمن وسريع";

        if (connected) {

            status.textContent = "متصل";
            button.textContent = "قطع الاتصال";

        } else {

            status.textContent = "غير متصل";
            button.textContent = "اتصال";
        }
    }
}

</script>

</body>
</html>
